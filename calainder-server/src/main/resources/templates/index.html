<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calainder</title>
    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="/css/feedback-widget.css">
</head>

<!--전체 화면 고정(100%)-->
<body class="app-shell">

<nav class="app-auth" aria-label="계정">
    <a id="loginLink" class="app-auth__link" href="/oauth2/authorization/google" hidden>로그인</a>
    <form id="logoutForm" action="/logout" method="post" hidden>
        <button class="app-auth__link" type="submit">로그아웃</button>
    </form>
</nav>

<!--스플래쉬 화면-->
<section id="appLanding" class="app-splash">
    <h1 class="app-splash__title">Calainder</h1>
    <p class="app-splash__description">
        Calainder는 텍스트와 이미지에서 일정을 분석하고<br>
        Google Calendar 및 학교 E-Class 일정 연동을 지원하는 AI 일정 관리 서비스입니다.
    </p>
    <button id="appEnterButton" type="button" class="app-splash__enter" aria-label="시작하기">↓</button>
    <div class="app-splash__legal" aria-label="정책 링크">
        <a href="/privacy" class="app-splash__legal-link">개인정보처리방침</a>
        <span class="app-splash__legal-divider" aria-hidden="true">·</span>
        <a href="/terms" class="app-splash__legal-link">서비스 이용약관</a>
    </div>
</section>

<!--스플래쉬 이후 화면-->
<header class="app-header">AI 일정 생성</header>

<!--채팅 기록창-->
<main class="app-main">
    <section id="chatFeed" class="chat-feed">
        <div class="chat-message chat-message--ai">추가할 일정이나 조회할 내용을 입력해주세요.</div>
    </section>
</main>

<!--E-class 크롤링 로그인 화면-->
<div id="crawlLoginModal" class="app-modal">
    <form id="crawlLoginForm" class="app-modal__window">
        <h2 class="app-modal__title">과제 일정 가져오기</h2>

        <label class="app-modal__label" for="studentIdInput">학번</label>
        <input id="studentIdInput" class="app-modal__input" type="text" placeholder="예: 2025123456">

        <label class="app-modal__label" for="studentPasswordInput">비밀번호</label>
        <input id="studentPasswordInput" class="app-modal__input" type="password" placeholder="비밀번호 입력">

        <div class="app-modal__actions">
            <button id="crawlLoginCancelButton" type="button" class="app-modal__button app-modal__button--neutral">닫기</button>
            <button type="submit" class="app-modal__button app-modal__button--primary">확인</button>
        </div>
    </form>
</div>

<!--채팅창-->
<section id="chatComposer" class="chat-composer">
    <div id="attachmentPreview" class="chat-composer__preview" hidden></div>
    <div class="chat-composer__row">
        <input id="attachmentInput" type="file" accept="image/*" hidden>
        <button id="attachmentButton" type="button" class="chat-composer__icon" aria-label="이미지 업로드">📎</button>
        <div id="composerDropZone" class="chat-composer__drop-zone">
            <textarea
                id="composerInput"
                class="chat-composer__input"
                rows="2"
                placeholder="예: 내일 오전 10시에 팀 미팅 잡아줘"></textarea>
        </div>
        <button id="sendMessageButton" type="button" class="chat-composer__submit">전송</button>
    </div>
</section>

<!--퀵메뉴-->
<div id="quickMenu" class="quick-menu" hidden>
    <div id="quickMenuPanel" class="quick-menu__panel" hidden>
        <button id="openGoogleCalendarButton" type="button" class="quick-menu__item">내 구글 캘린더로 이동</button>
        <button id="crawlLoginButton" type="button" class="quick-menu__item">과제 일정 가져오기</button>
        <button id="feedbackButton" type="button" class="quick-menu__item">피드백 남기기</button>
    </div>
    <button id="quickMenuButton" type="button" class="quick-menu__trigger" aria-label="추가 기능 열기" aria-expanded="false">☰</button>
</div>

<div id="appToast" class="app-toast"></div>

<script type="module" src="/js/index.js"></script>
<script type="module" src="/js/auth-status.js"></script>
<script>
    window.FeedbackWidgetConfig = {
        endpoint: '/api/feedback',
        buttonSelector: '#feedbackButton'
    };
</script>
<script src="/js/feedback-widget.js"></script>
</body>
</html>
