spring:
  application:
    name: calainder-server

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - https://www.googleapis.com/auth/userinfo.email
              - https://www.googleapis.com/auth/userinfo.profile
              - https://www.googleapis.com/auth/calendar.events
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8888/login/oauth2/code/google}

fastapi:
  ai-base-url: ${FASTAPI_AI_BASE_URL:http://localhost:8000}
  crawl-base-url: ${FASTAPI_CRAWL_BASE_URL:http://localhost:9000}

feedback:
  base-url: ${FEEDBACK_API_BASE_URL:http://localhost:7000}

aes:
    key: ${AES_KEY}

server:
  port: 8888
